name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  api:
    name: Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore OzoneAI.sln
      - name: Build
        run: dotnet build OzoneAI.sln -c Release --no-restore
      - name: Test with 100% line coverage gate (auth/tenancy)
        working-directory: ${{ github.workspace }}
        run: dotnet test tests/OzoneAI.UnitTests/OzoneAI.UnitTests.csproj -c Release

  web:
    name: Build web (when present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: apps/ozone_web
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "Web app not scaffolded yet — placeholder OK"
          fi
